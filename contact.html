<html>

<head>
	<title>Charlie's Portfolio</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
	<script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>

	<style>
		p {
			text-align: center;
		}
	</style>

</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NM2B64ZJXM"></script>
<script>
	window.dataLayer = window.dataLayer || [];

	function gtag() {
		dataLayer.push(arguments);
	}
	gtag('js', new Date());

	gtag('config', 'G-NM2B64ZJXM');
</script>

<body>

	<div id="nav-placeholder"></div>

	<article>
		<div class="container">
			<h2>Contact Me</h2>
		</div>

		<p>Thank you for taking the time to explore my portfolio.</p>
		<p>If you have any questions, feel free to reach out to me. I am always open to new opportunities and connections.
		</p>
		<div class="colored">
			<div class="colored">

				<p>
					<img class="contact-icon" src="img/contact/GmailIcon.png" alt="Gmail">
					Email: charliehagamedesign@gmail.com
				</p>

				<p>
					<a href="https://www.linkedin.com/in/charlie-ha/">
						<img class="contact-icon" src="img/contact/linkedinIcon.png" alt="LinkedIn">
						LinkedIn: Charlie Ha
					</a>
				</p>

				<p>
					<a href="https://www.artstation.com/charlie_ha">
						<img class="contact-icon" src="img/contact/ArtStationIcon.png" alt="ArtStation">
						Art Portfolio
					</a>
				</p>

			</div>
		</div>
	</article>


	<script>
		fetch("nav.html")
			.then(response => response.text())
			.then(data => {
				document.getElementById("nav-placeholder").innerHTML = data;

				const current = window.location.pathname;

				document.querySelectorAll("#navigation a").forEach(link => {
					if (link.pathname === current) {
						link.classList.add("active");
					}
				});
			});
	</script>
</body>

</html>
